<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribe — Berlin Trust Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: #f6f4ef;
      color: #343230;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #faf9f6;
      border: 1px solid #e8e3da;
      border-radius: 12px;
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
    }
    .title-en {
      display: block;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 22px;
      font-weight: 500;
      color: #343230;
      line-height: 1.15;
      letter-spacing: -.02em;
    }
    .title-de {
      display: block;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 19px;
      font-weight: 500;
      color: #b24a3a;
      line-height: 1.15;
      letter-spacing: -.02em;
      margin-top: 3px;
    }
    .divider {
      border: none;
      border-top: 1px solid #e8e3da;
      margin: 24px 0;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #6c6a66;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #343230;
      color: #fff;
      font-family: "Inter", sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      padding: 11px 20px;
      border-radius: 6px;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .note {
      font-size: 11px;
      color: #8c877f;
      margin-top: 16px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="title-en">Berlin Trust Index</span>
    <span class="title-de">Berlin Vertrauensindex</span>
    <hr class="divider">
    <p>To unsubscribe from this mailing list, send us an email and we'll remove you straight away.</p>
    <a class="btn" href="mailto:hello@berlintrustindex.com?subject=Unsubscribe&body=Please remove me from the Berlin Trust Index mailing list.">Unsubscribe →</a>
    <p class="note">We don't share your address with anyone. This is the only email we've sent.</p>
  </div>
</body>
</html>
